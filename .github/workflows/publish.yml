name: Publish to Maven Central

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Publish Artifacts with Force Credentials
        # We explicitly inject the username and password directly into the central plugin properties via -D flags
        run: |
          mvn clean deploy -B -e -X \
            -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}" \
            -DpublishingServerId=central \
            -Dcentral.username="${{ secrets.MAVEN_CENTRAL_USERNAME }}" \
            -Dcentral.password="${{ secrets.MAVEN_CENTRAL_TOKEN }}"