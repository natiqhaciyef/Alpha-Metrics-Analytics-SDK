# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process.
# Combined memory allocation, modern parallel garbage collection, and strict UTF-8 file encoding.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Enables parallel task execution for faster compilation across decoupled sub-projects.
org.gradle.parallel=true

# Caching optimization to drastically reduce compile times on subsequent native/Kotlin runs.
org.gradle.caching=true

# AndroidX package structure configuration
android.useAndroidX=true

# Kotlin code style for this project
kotlin.code.style=official

# Reduces R class sizes by keeping them non-transitive
android.nonTransitiveRClass=true